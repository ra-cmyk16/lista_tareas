<!DOCTYPE html>
<html lang="es"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mis tareas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar">

    <a class="logo" th:href="@{/}">
        Lista de Tareas
    </a>

    <div class="enlaces">

        <a th:href="@{/}">
            Inicio
        </a>

        <a th:href="@{/tareas}">
            Mis tareas
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit">
                Cerrar sesión
            </button>
        </form>

    </div>

</nav>
    <h1>Mi lista de tareas</h1>

    <h2>Nueva tarea</h2>

    <form class="formulario"
      th:action="@{/tareas/guardar}"
      th:object="${tarea}"
      method="post">

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" th:field="*{titulo}">

       <p class="error"
   th:if="${#fields.hasErrors('titulo')}"
   th:errors="*{titulo}">
</p>
        <br><br>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" th:field="*{descripcion}"></textarea>

        <br><br>

        <button type="submit">Guardar tarea</button>

    </form>

    <hr>

    <h2>Tareas</h2>

    <div th:if="${tareas.isEmpty()}">
        <p>No tienes tareas todavía.</p>
    </div>

    <div class="tarea" th:each="tarea : ${tareas}">

        <h3 th:text="${tarea.titulo}"></h3>

        <p th:text="${tarea.descripcion}"></p>

      <p class="estado">
    Estado:
    <span th:if="${tarea.completada}">Completada</span>
    <span th:unless="${tarea.completada}">Pendiente</span>
</p>

        <a th:href="@{/tareas/editar/{id}(id=${tarea.id})}">
            Editar
        </a>

        <a th:href="@{/tareas/eliminar/{id}(id=${tarea.id})}">
            Eliminar
        </a>

    </div>

</body>
</html>
